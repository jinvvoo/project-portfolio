<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">얼굴 랜드마크 검출부터 마스크 합성까지의 3단계</title>
  <desc id="desc">68개 얼굴 랜드마크에서 핵심 좌표를 선택하고, 마스크의 폭과 높이 및 회전각을 계산한 뒤 얼굴 이미지에 마스크를 합성하는 과정</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
    <linearGradient id="maskFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe" />
      <stop offset="1" stop-color="#bae6fd" />
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="20" fill="#f8fafc" />

  <g filter="url(#shadow)">
    <rect x="30" y="28" width="340" height="304" rx="18" fill="#ffffff" />
    <rect x="430" y="28" width="340" height="304" rx="18" fill="#ffffff" />
    <rect x="830" y="28" width="340" height="304" rx="18" fill="#ffffff" />
  </g>

  <g font-family="Pretendard, Noto Sans KR, Arial, sans-serif" fill="#0f172a">
