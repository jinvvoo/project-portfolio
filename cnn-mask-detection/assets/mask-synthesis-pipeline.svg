    <text x="62" y="68" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1</text>
    <text x="91" y="68" font-size="19" font-weight="700">얼굴 랜드마크 검출</text>

    <circle cx="462" cy="62" r="18" fill="#2563eb" />
    <text x="462" y="68" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>
    <text x="491" y="68" font-size="19" font-weight="700">마스크 크기·각도 계산</text>

    <circle cx="862" cy="62" r="18" fill="#2563eb" />
    <text x="862" y="68" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">3</text>
    <text x="891" y="68" font-size="19" font-weight="700">얼굴 이미지에 합성</text>
  </g>

  <g stroke="#475569" stroke-width="3" fill="#f1f5f9">
