    <circle cx="200" cy="278" r="7" />
    <circle cx="252" cy="227" r="7" />
    <circle cx="200" cy="204" r="7" />
  </g>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">
    <text x="128" y="225">3</text><text x="191" y="303">8</text><text x="260" y="225">13</text><text x="210" y="199">29</text>
  </g>

