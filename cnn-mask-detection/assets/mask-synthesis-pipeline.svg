    <circle cx="179" cy="222" r="4" /><circle cx="190" cy="218" r="4" /><circle cx="200" cy="220" r="4" />
    <circle cx="210" cy="218" r="4" /><circle cx="221" cy="222" r="4" /><circle cx="200" cy="230" r="4" />
