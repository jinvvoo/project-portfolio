    <path d="M210 166 Q223 154 240 166" />
    <path d="M175 225 Q200 238 225 225" />
    <path d="M560 166 Q577 154 590 166" opacity="0.55" />
    <path d="M610 166 Q623 154 640 166" opacity="0.55" />
    <path d="M960 166 Q977 154 990 166" />
    <path d="M1010 166 Q1023 154 1040 166" />
  </g>

  <g fill="#22c55e">
    <circle cx="137" cy="181" r="4" /><circle cx="141" cy="204" r="4" /><circle cx="148" cy="227" r="4" />
    <circle cx="159" cy="248" r="4" /><circle cx="176" cy="268" r="4" /><circle cx="200" cy="278" r="4" />
