    <circle cx="548" cy="227" r="6" /><circle cx="652" cy="227" r="6" /><circle cx="600" cy="204" r="6" /><circle cx="600" cy="278" r="6" />
  </g>
  <g font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="700">
    <text x="645" y="218" text-anchor="middle" fill="#c2410c">폭</text>
    <text x="690" y="250" fill="#1d4ed8">높이</text>
    <text x="600" y="140" text-anchor="middle" fill="#6d28d9">회전각</text>
  </g>

  <g>
    <path d="M932 210 Q1000 185 1068 210 L1057 260 Q1000 286 943 260 Z" fill="url(#maskFill)" stroke="#0284c7" stroke-width="3" />
    <path d="M932 218 Q911 216 900 233" fill="none" stroke="#0284c7" stroke-width="4" />
    <path d="M1068 218 Q1089 216 1100 233" fill="none" stroke="#0284c7" stroke-width="4" />
    <path d="M948 224 Q1000 242 1052 224" fill="none" stroke="#7dd3fc" stroke-width="3" />
    <path d="M947 242 Q1000 260 1053 242" fill="none" stroke="#7dd3fc" stroke-width="3" />
  </g>

  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <line x1="382" y1="180" x2="418" y2="180" />
    <line x1="782" y1="180" x2="818" y2="180" />
  </g>

  <g font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">
    <text x="200" y="318">68개 좌표 중 3·8·13·29번을 핵심점으로 사용</text>
    <text x="600" y="318">얼굴 폭·높이와 기울기에 맞춰 마스크 변형</text>
    <text x="1000" y="318">Pillow·OpenCV로 올바른 착용 이미지를 생성</text>
  </g>
</svg>
