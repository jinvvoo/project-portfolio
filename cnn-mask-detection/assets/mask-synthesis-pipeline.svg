    <ellipse cx="600" cy="190" rx="80" ry="105" opacity="0.45" />
    <ellipse cx="1000" cy="190" rx="80" ry="105" />
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round">
